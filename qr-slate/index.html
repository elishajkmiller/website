<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>ART: Outside the Box QR Slate (Concept)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;font-family:"Open Sans",Arial,sans-serif;background:#111110;color:#e8e6e3;line-height:1.6}
    main{max-width:760px;margin:0 auto;padding:32px 16px 48px}
    h1{color:#333;font-size:1.6rem;margin:0 0 4px}
    .tag{color:#ef6944;font-weight:600;margin:0 0 20px}
    img.slate{width:100%;height:auto;display:block;border:1px solid #3a3835;background:#fff}
    p{margin:16px 0;font-weight:500;color:#a9a6a2}
    .btns{display:flex;gap:10px;flex-wrap:wrap}
    a.btn{display:inline-block;background:#62c8c9;color:#111110;font-weight:700;padding:10px 18px;border-radius:4px;text-decoration:none;transition:opacity .2s}
    a.btn:hover{opacity:.8}
    ul{padding-left:20px}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
    .tab{font:500 16px/1.7em 'Open Sans',Arial,sans-serif;padding:.1em .9em;background:transparent;border:2px solid #62c8c9;border-radius:3px;color:#62c8c9;cursor:pointer;transition:all .2s}
    .tab:hover{background:#222120;color:#fff}
    .tab.on{background:#62c8c9;color:#111110}
    .note{font-size:.85rem;color:#7d7a76}
  </style>
</head>
<body>
<main>
  <p class="tag">Concept slate: ART: Outside the Box</p>
  <div class="tabs" id="tabs">
    <button class="tab on" data-src="label.png">Version 1</button>
    <button class="tab" data-src="label-v2.png">Version 2</button>
    <button class="tab" data-src="label-v3.png">Version 3</button>
  </div>
  <img class="slate" id="slate" src="label.png" alt="Rectangular QR slate with the Downtown Joplin Alliance logo, a QR code, and sponsor logos for Allo, Sparklight, KODE and KSN">
  <p class="btns"><a class="btn" href="/downtown-joplin-art/">See the landing page</a></p>
  <p>6 × 3 inches here as a sample.</p>
  <p class="note">Concept preview only, not final artwork.</p>
</main>
<script>
  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab'); if(!b)return;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});
    document.getElementById('slate').src=b.dataset.src;
  });
  (function(){
    var v=new URLSearchParams(location.search).get('v');
    var tabs=document.querySelectorAll('.tab');
    if(v&&tabs[v-1])tabs[v-1].click();
  })();
</script>
</body>
</html>
