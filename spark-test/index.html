<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>POW417 Spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap">
<style>
/* One screen: "Your spark is Humanity", sparks flying off the letters of the word */
:root{
  --bg:#e0e6e8; --ink:#18181c; --muted:#5a5e6b;
  --heat:#5d59e6; --heat-soft:rgba(93,89,230,.45);
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16161b;--ink:#ecebf7;--muted:#9a9ab0;--heat:#9f9cef;--heat-soft:rgba(143,140,255,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161b;--ink:#ecebf7;--muted:#9a9ab0;--heat:#9f9cef;--heat-soft:rgba(143,140,255,.55);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  display:flex;flex-direction:column;overflow-x:hidden}
.top,.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--muted);position:relative;z-index:3}
.top b{color:var(--ink);font-weight:400}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;position:relative;min-height:420px}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lead{font-family:var(--display);font-size:clamp(28px,5vw,44px);letter-spacing:.04em;margin:0;position:relative;z-index:1}
.word{font-family:var(--display);font-weight:400;line-height:.9;margin:0;position:relative;z-index:1;
  font-size:clamp(64px,15vw,200px);letter-spacing:.01em;max-width:100%;overflow-wrap:anywhere;
  transform:skewX(-10deg);color:var(--ink)}
.tabs{display:flex;gap:18px}
.tabs a{color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.tabs a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* Countdown: the old film leader circle on its own. Grey disc, two rings, a crosshair, a sweep that goes round once a second,
   the days left as the big number and hours, minutes and seconds under it. */
.leader{position:relative;z-index:1;width:min(100%,560px);aspect-ratio:1;overflow:hidden;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(20,20,24,.5) var(--a,0deg),rgba(0,0,0,0) 0),radial-gradient(circle,#a9a9a4 0%,#8d8d88 60%,#7a7a75 100%);
  animation:flick .9s steps(1) infinite}
.leader .rings{position:absolute;inset:0;margin:auto;height:100%;aspect-ratio:1;border-radius:50%;border:clamp(3px,.6vw,5px) solid #f2f1ec;box-shadow:0 0 0 2px #1a1a1a}
.leader .rings::after{content:"";position:absolute;inset:8%;border-radius:50%;border:clamp(3px,.6vw,5px) solid #f2f1ec;box-shadow:inset 0 0 0 2px #1a1a1a}
.leader .cross{position:absolute;inset:0;background:linear-gradient(#1a1a1a,#1a1a1a) 50% 0/2px 100% no-repeat,linear-gradient(#1a1a1a,#1a1a1a) 0 50%/100% 2px no-repeat;opacity:.75}
.leader .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;color:#111;font-family:var(--display);line-height:.85;font-variant-numeric:tabular-nums}
.leader .big{font-size:clamp(96px,26vw,300px)}
.leader .small{font-size:clamp(20px,4.6vw,48px);letter-spacing:.06em;background:#8d8d88;padding:0 .3em}
.leader .lab{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-family:var(--display);font-size:clamp(12px,2vw,20px);letter-spacing:.2em;color:#1a1a1a}
@keyframes flick{0%{filter:brightness(1)}23%{filter:brightness(1.06)}47%{filter:brightness(.95)}71%{filter:brightness(1.03)}}
@media (prefers-reduced-motion: reduce){.leader{animation:none}}
</style>
</head>
<body>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="top"><b>POW417</b><nav class="tabs" aria-label="Views"><a href="#spark" id="tab-spark">Spark</a><a href="#countdown" id="tab-countdown">Countdown</a></nav><span>A no AI 48-hour film challenge</span></div>

<main>
  <p class="lead" id="lead">Your spark is</p>
  <h1 class="word" id="word">Humanity</h1>
  <div class="leader" id="film" hidden role="timer" aria-label="Time until March 19, 2027">
    <div class="rings"></div><div class="cross"></div>
    <div class="num"><span class="big" id="cdDays">0</span><span class="small" id="cdRest">00:00:00</span></div>
    <span class="lab">Days to go</span>
  </div>
</main>

<div class="bottom"><span>March 19–21, 2027</span><span>New year. Same mission.</span></div>

<script>
// Sparks fly off the edges of the letters in "Humanity": tapered lines with a rounded front
// and a bright core. No canvas blur, it was too slow on phones.
const cv=document.getElementById("sparks"),ctx=cv.getContext("2d"),word=document.getElementById("word");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const isDark=()=>{const m=getComputedStyle(document.body).backgroundColor.match(/\d+/);return m&&+m[0]<100};
const COLS=["#9f9cef","#7d79ea","#5d59e6","#4a45e0"];
let W=0,H=0,dpr=1,edges=[],center=[0,0],sparks=[],last=0,owed=0,dark=false;

function resize(){
  dark=isDark();
  dpr=Math.min(1.5,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  sampleWord();
}

// draw the word off screen and keep the pixels on its outline as spark sources
function sampleWord(){
  const r=word.getBoundingClientRect(),cs=getComputedStyle(word);
  const fs=parseFloat(cs.fontSize),pad=Math.ceil(fs*.4);
  const w=Math.ceil(r.width)+pad*2,h=Math.ceil(r.height)+pad*2;
  const oc=document.createElement("canvas");oc.width=w;oc.height=h;const o=oc.getContext("2d");
  o.font=`400 ${fs}px ${cs.fontFamily}`;o.textAlign="center";o.textBaseline="alphabetic";o.fillStyle="#000";
  const text=word.textContent.trim(),m=o.measureText(text);
  const k=Math.tan(-10*Math.PI/180),cy=h/2;
  // skewX(-10deg) around the vertical centre, like the CSS transform
  o.setTransform(1,0,k,1,-k*cy,0);
  const base=cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
  o.fillText(text,w/2,base);
  const d=o.getImageData(0,0,w,h).data,a=(x,y)=>d[(y*w+x)*4+3];
  // only the outer edge of the whole word: top and bottom of each column, ends of each row
  edges=[];const step=Math.max(2,Math.round(fs/60)),X=r.left-pad,Y=r.top-pad;
  for(let x=0;x<w;x+=step){let t=-1,b=-1;for(let y=0;y<h;y++)if(a(x,y)>128){if(t<0)t=y;b=y}
    if(t>=0){edges.push([X+x,Y+t,0,-1]);edges.push([X+x,Y+b,0,1])}}
  for(let y=0;y<h;y+=step){let l=-1,rr=-1;for(let x=0;x<w;x++)if(a(x,y)>128){if(l<0)l=x;rr=x}
    if(l>=0){edges.push([X+l,Y+y,-1,0]);edges.push([X+rr,Y+y,1,0])}}
  center=[r.left+r.width/2,r.top+r.height/2];
}

function spawn(){
  if(!edges.length)return;
  const [x,y,nx,ny]=edges[Math.floor(Math.random()*edges.length)];
  const a=Math.atan2(ny,nx)+(Math.random()-.5)*1.3;
  const sp=120+Math.random()*320;
  sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0,max:.6+Math.random()*1.1,
    w:1.2+Math.random()*2.3,c:COLS[Math.floor(Math.random()*COLS.length)]});
}

function drawSpark(s,glow){
  const x=s.life/s.max,fade=Math.min(1,x*10)*(1-x);
  const speed=Math.hypot(s.vx,s.vy)||1,tail=Math.max(10,speed*.12);
  const ux=s.vx/speed,uy=s.vy/speed,hw=s.w*(1-x*.4),nx=-uy*hw,ny=ux*hw;
  const tx=s.x-ux*tail,ty=s.y-uy*tail;
  ctx.globalAlpha=Math.min(1,fade*1.4);
  ctx.fillStyle=s.c;
  // tapered line: a point at the tail, a rounded front
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x+nx,s.y+ny);ctx.arc(s.x,s.y,hw,Math.atan2(ny,nx),Math.atan2(-ny,-nx),true);ctx.closePath();ctx.fill();
  // bright core
  ctx.fillStyle="#eceafd";
  ctx.beginPath();ctx.moveTo(s.x-ux*tail*.55,s.y-uy*tail*.55);ctx.lineTo(s.x+nx*.4,s.y+ny*.4);ctx.lineTo(s.x-nx*.4,s.y-ny*.4);ctx.closePath();ctx.fill();
}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation=dark?"lighter":"source-over";
  if(mode==='spark'){owed+=dt*70;while(owed>=1&&sparks.length<110){spawn();owed--}}
  sparks=sparks.filter(s=>{s.life+=dt;const dr=Math.exp(-1.1*dt);s.vx*=dr;s.vy=s.vy*dr+30*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;return s.life<s.max});
  for(const s of sparks)drawSpark(s,true);
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

function still(){
  ctx.clearRect(0,0,W,H);
  for(let k=0;k<40;k++){spawn();const s=sparks.pop();if(!s)break;s.life=s.max*.4;s.x+=s.vx*.25;s.y+=s.vy*.25;drawSpark(s,false)}
  ctx.globalAlpha=1;
}


// two views: #spark shows the word with sparks, #countdown shows an old film leader countdown
// start time: Friday March 19, 2027, 6:00 PM Central (change START to move it)
const START=new Date("2027-03-19T18:00:00-05:00").getTime();
const lead=document.getElementById("lead"),film=document.getElementById("film");
let mode="spark",timer=0;
const cdDays=document.getElementById("cdDays"),cdRest=document.getElementById("cdRest");
function tick(){
  const ms=Math.max(0,START-Date.now()),t=Math.floor(ms/1000),p=n=>String(n).padStart(2,"0");
  const d=String(Math.floor(t/86400)),rest=`${p(Math.floor(t%86400/3600))}:${p(Math.floor(t%3600/60))}:${p(t%60)}`;
  if(cdDays.textContent!==d)cdDays.textContent=d;if(cdRest.textContent!==rest)cdRest.textContent=rest;
  // the sweep goes round once a second
  film.style.setProperty("--a",reduce?"0deg":(360-(ms%1000)*.36).toFixed(1)+"deg");
  if(mode==="countdown"&&!reduce)requestAnimationFrame(tick);
}
function route(){
  mode=location.hash==="#countdown"?"countdown":"spark";
  const ts=document.getElementById("tab-spark"),tc=document.getElementById("tab-countdown");
  ts.removeAttribute("aria-current");tc.removeAttribute("aria-current");(mode==="spark"?ts:tc).setAttribute("aria-current","page");
  clearInterval(timer);
  const cd=mode==="countdown";
  lead.textContent=cd?"Your spark lights up in":"Your spark is";word.hidden=cd;film.hidden=!cd;
  if(cd){tick();if(reduce)timer=setInterval(tick,1000)}
  sparks=[];ctx.clearRect(0,0,W,H);if(!cd){sampleWord();if(reduce)still()}
}
addEventListener("hashchange",route);
addEventListener("resize",()=>{resize();if(reduce&&mode==="spark")still()});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{dark=isDark()});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{resize();route();if(!reduce)requestAnimationFrame(frame)});
</script>
</body>
</html>
