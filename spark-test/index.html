<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>POW417 Spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap">
<style>
/* One screen: "Your spark is Humanity" over the living spark */
:root{
  --bg:#e0e6e8; --ink:#18181c; --muted:#5a5e6b; --line:#c6ced2;
  --blue:#4a45e0; --blue2:#5d59e6; --lav:#9f9cef; --pale:#d3d1f8; --deep:#2b2690;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16161b;--ink:#ecebf7;--muted:#9a9ab0;--line:#33333f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161b;--ink:#ecebf7;--muted:#9a9ab0;--line:#33333f;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  display:flex;flex-direction:column;overflow-x:hidden}
.top,.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--muted)}
.top b{color:var(--ink);font-weight:400}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;position:relative;min-height:420px}
#burst{position:absolute;inset:0;margin:auto;width:min(90vw,700px);height:min(90vw,700px);overflow:visible;pointer-events:none;opacity:.9;z-index:0}
.lead{font-family:var(--display);font-size:clamp(28px,5vw,44px);letter-spacing:.04em;margin:0;position:relative;z-index:1}
.word{font-family:var(--display);font-weight:400;line-height:.9;margin:0;position:relative;z-index:1;
  font-size:clamp(64px,15vw,200px);letter-spacing:.01em;text-wrap:balance;max-width:100%;overflow-wrap:anywhere;
  transform:skewX(-10deg)}
.tag{font-family:var(--display);font-size:clamp(20px,3vw,28px);letter-spacing:.08em;color:var(--muted);margin:0;position:relative;z-index:1}
@media (prefers-reduced-motion: reduce){.word{transition:none}}
</style>
</head>
<body>
<div class="top"><b>POW417</b><span>A no AI 48-hour film challenge</span></div>

<main>
  <svg id="burst" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg>
  <p class="lead">Your spark is</p>
  <h1 class="word" id="word">Humanity</h1>
  <p class="tag">No prompt required.</p>
</main>

<div class="bottom"><span>March 19–21, 2027</span><span>New year. Same mission.</span></div>

<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
// living spark behind the word: points grow and shrink on their own, the body beats like a heart,
// facets flicker, and embers bud off the tips and drift away
const COLS=["#d3d1f8","#9f9cef","#5d59e6","#2b2690"];
function rngOf(seed){let a=seed|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let sparkSeed=417,popStart=0,pts=[],embers=[],lastEmber=0,lastT=0;
function makePoints(seed){
  const r=rngOf(seed),n=9;pts=[];
  for(let i=0;i<n;i++){const ang=i/n*Math.PI*2+(r()-.5)*.25;const axis=Math.abs(Math.sin(ang*2))<.35;
    pts.push({a:ang,l:(axis?1:.45+r()*.3),f:.6+r()*1.6,ph:r()*6.3,f2:2+r()*3,ph2:r()*6.3})}
}
// random pulse: beats come at uneven gaps with uneven strength, sometimes a double or a flutter
let beats=[],nextBeat=0;
function beat(t){
  if(t>=nextBeat){
    const amp=.35+Math.random()*.9;beats.push({t0:t,amp,w:.05+Math.random()*.07});
    const r=Math.random();
    if(r<.3)beats.push({t0:t+.14+Math.random()*.1,amp:amp*(.4+Math.random()*.4),w:.06});
    else if(r<.4)for(let k=1;k<4;k++)beats.push({t0:t+k*(.09+Math.random()*.05),amp:amp*.5,w:.04});
    nextBeat=t+.35+Math.random()*Math.random()*2.4;
  }
  beats=beats.filter(b=>t-b.t0<1);
  let v=0;for(const b of beats)v+=b.amp*Math.exp(-Math.pow((t-b.t0)/b.w,2))*(t>=b.t0-.2?1:0);
  return Math.min(v,1.6);
}
function facets(list,R,ir,rot,light,t,flick){
  let g="";const n=list.length;
  for(let i=0;i<n;i++){
    const p=list[i],pv=list[(i-1+n)%n],nx=list[(i+1)%n];let ap=pv.a,an=nx.a;if(an<p.a)an+=Math.PI*2;if(ap>p.a)ap-=Math.PI*2;
    const L=p.l*(1+.2*Math.sin(t*p.f+p.ph)+.07*Math.sin(t*p.f2+p.ph2));
    const A=p.a+rot+.04*Math.sin(t*p.f*.7+p.ph),tip=[Math.sin(A)*R*L,-Math.cos(A)*R*L];
    const vL=[Math.sin((ap+p.a)/2+rot)*ir,-Math.cos((ap+p.a)/2+rot)*ir],vR=[Math.sin((p.a+an)/2+rot)*ir,-Math.cos((p.a+an)/2+rot)*ir];
    for(const [side,v] of [[-1,vL],[1,vR]]){
      const lit=Math.cos(A+side*Math.PI/2-light),ray=Math.cos(A-light);
      let k=lit>0?(ray>-.2?0:1):(ray>-.2?2:3);
      if(flick&&Math.sin(t*9+i*1.7+side)>.97)k=Math.max(0,k-2);
      g+=`<polygon points="0,0 ${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${v[0].toFixed(1)},${v[1].toFixed(1)}" fill="${COLS[k]}" stroke="${COLS[k]}" stroke-width="1"/>`;
    }
  }
  return g;
}
function tipOf(i,R,rot,t){const p=pts[i];const L=p.l*(1+.2*Math.sin(t*p.f+p.ph));const A=p.a+rot;return[Math.sin(A)*R*L,-Math.cos(A)*R*L,A]}
const mini=[0,Math.PI/2,Math.PI,Math.PI*1.5].map((a,i)=>({a,l:i%2?.55:1,f:3,ph:i,f2:5,ph2:i}));
function drawBurst(now){
  const t=now/1000,dt=Math.min(.05,t-lastT||0);lastT=t;
  const age=(now-popStart)/500,pop=Math.min(1,age);
  const grow=reduce?1:(1-Math.pow(1-pop,3))*(1+(pop<1?Math.sin(pop*Math.PI)*.15:0));
  const b=reduce?0:beat(t);
  const R=430*grow*(1+.09*b),rot=reduce?0:t*.1+.03*Math.sin(t*1.3),light=reduce?-.7:-.7+Math.sin(t*.9)*1.5;
  const body=facets(pts,R,R*(.15+.05*b),rot,light,reduce?0:t,!reduce);
  // embers
  if(!reduce&&now-lastEmber>110&&pop>=1){lastEmber=now;const i=Math.floor(Math.random()*pts.length);const [x,y,A]=tipOf(i,R,rot,t);
    embers.push({x,y,vx:Math.sin(A)*(60+Math.random()*90)+(Math.random()-.5)*40,vy:-Math.cos(A)*(60+Math.random()*90)-20,life:0,max:1+Math.random()*.8,s:14+Math.random()*26,rot:Math.random()*6})}
  let em="";
  embers=embers.filter(e=>{e.life+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy-=12*dt;e.rot+=dt*2;return e.life<e.max});
  for(const e of embers){const k=1-e.life/e.max;
    em+=`<g transform="translate(${e.x.toFixed(1)} ${e.y.toFixed(1)}) scale(${(k*1).toFixed(3)})" opacity="${k.toFixed(2)}">${facets(mini,e.s,e.s*.18,e.rot,light,t,false)}</g>`}
  $("burst").innerHTML=`<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${(22+18*b).toFixed(1)}"/></filter></defs>
    <g transform="skewX(-10)"><g filter="url(#glow)" opacity="${(.35+.4*b).toFixed(2)}">${body}</g>${body}${em}</g>`;
  $("word").style.transform=`skewX(-10deg) scale(${(1+.015*b).toFixed(4)})`;
  if(!reduce)requestAnimationFrame(drawBurst);
}
makePoints(sparkSeed);

popStart=performance.now();if(reduce)drawBurst(performance.now());else requestAnimationFrame(drawBurst);
</script>
</body>
</html>
