<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>POW417 Spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap">
<style>
/* One screen: eyebrow, "Your spark is", the drawn word, draw button, recent draws */
:root{
  --bg:#e0e6e8; --ink:#18181c; --muted:#5a5e6b; --line:#c6ced2;
  --blue:#4a45e0; --blue2:#5d59e6; --lav:#9f9cef; --pale:#d3d1f8; --deep:#2b2690;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16161b;--ink:#ecebf7;--muted:#9a9ab0;--line:#33333f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161b;--ink:#ecebf7;--muted:#9a9ab0;--line:#33333f;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  display:flex;flex-direction:column;overflow-x:hidden}
.top,.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--muted)}
.top b{color:var(--ink);font-weight:400}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;position:relative;min-height:420px}
#burst{position:absolute;inset:0;margin:auto;width:min(80vw,620px);height:min(80vw,620px);pointer-events:none;opacity:.9;z-index:0}
.lead{font-family:var(--display);font-size:clamp(28px,5vw,44px);letter-spacing:.04em;margin:0;position:relative;z-index:1}
.word{font-family:var(--display);font-weight:400;line-height:.9;margin:0;position:relative;z-index:1;
  font-size:clamp(64px,15vw,200px);letter-spacing:.01em;text-wrap:balance;max-width:100%;overflow-wrap:anywhere;
  transform:skewX(-10deg)}
.word.rolling{color:var(--blue)}
.tag{font-family:var(--display);font-size:clamp(20px,3vw,28px);letter-spacing:.08em;color:var(--muted);margin:0;position:relative;z-index:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
button{font-family:var(--display);font-size:24px;letter-spacing:.06em;padding:12px 26px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--bg)}
button:hover{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.recent{position:relative;z-index:1;display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--muted);min-height:1.4em}
.recent span:first-child{color:var(--ink)}
.note{font-size:14px;color:var(--muted);min-height:1.2em;position:relative;z-index:1}
@media (prefers-reduced-motion: reduce){.word{transition:none}}
</style>
</head>
<body>
<div class="top"><b>POW417</b><span>A no AI 48-hour film challenge</span></div>

<main>
  <svg id="burst" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg>
  <p class="lead">Your spark is</p>
  <h1 class="word" id="word" aria-live="polite">Humanity</h1>
  <p class="tag">No prompt required.</p>
  <div class="actions">
    <button class="primary" id="draw">Draw a spark</button>
    <button id="copy">Copy</button>
  </div>
  <div class="recent" id="recent" aria-label="Recent sparks"></div>
  <div class="note" id="note"></div>
</main>

<div class="bottom"><span>March 19–21, 2027</span><span>New year. Same mission.</span></div>

<script>
// Hand-picked spark words. Edit this list to change what can be drawn.
const SPARKS=["Humanity","Home","Inheritance","Second chances","Borrowed time","Wrong number","Lost and found","First light","The last day","Strangers","Homecoming","Small hours","Leaving","Debt","Neighbours","The promise","Hands","Static","Low tide","Overtime","Night shift","Hometown","The receipt","Echo","Room for one more","Unfinished","Spare key","Rust","Out of season","Kindness"];
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let current="Humanity",recent=[],rolling=false;

// faceted spark shape behind the word (same style as spark-v1)
const COLS=["#d3d1f8","#9f9cef","#5d59e6","#2b2690"];
function sparkSVG(seed,scale,rot,light){
  let a=seed|0;const r=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const n=9,pts=[];
  for(let i=0;i<n;i++){const ang=i/n*Math.PI*2+(r()-.5)*.25;const axis=Math.abs(Math.sin(ang*2))<.35;pts.push({a:ang,l:(axis?1:.45+r()*.3)})}
  const R=460*scale,ir=R*.15;let g="";
  for(let i=0;i<n;i++){
    const p=pts[i],pv=pts[(i-1+n)%n],nx=pts[(i+1)%n];let ap=pv.a,an=nx.a;if(an<p.a)an+=Math.PI*2;if(ap>p.a)ap-=Math.PI*2;
    const A=p.a+rot,tip=[Math.sin(A)*R*p.l,-Math.cos(A)*R*p.l];
    const vL=[Math.sin((ap+p.a)/2+rot)*ir,-Math.cos((ap+p.a)/2+rot)*ir],vR=[Math.sin((p.a+an)/2+rot)*ir,-Math.cos((p.a+an)/2+rot)*ir];
    for(const [side,v] of [[-1,vL],[1,vR]]){
      const lit=Math.cos(A+side*Math.PI/2-light),ray=Math.cos(A-light);
      const c=lit>0?(ray>-.2?COLS[0]:COLS[1]):(ray>-.2?COLS[2]:COLS[3]);
      g+=`<polygon points="0,0 ${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${v[0].toFixed(1)},${v[1].toFixed(1)}" fill="${c}" stroke="${c}" stroke-width="1"/>`;
    }
  }
  return `<g transform="skewX(-10)">${g}</g>`;
}
let sparkSeed=417,popStart=0;
function drawBurst(now){
  const t=now/1000,age=(now-popStart)/500,pop=Math.min(1,age);
  const s=reduce?1:(1-Math.pow(1-pop,3))*(1+(pop<1?Math.sin(pop*Math.PI)*.1:0))*(1+Math.sin(t*2)*.02);
  $("burst").innerHTML=sparkSVG(sparkSeed,s,reduce?0:t*.12,reduce?-.7:-.7+Math.sin(t*.8)*1.4);
  if(!reduce)requestAnimationFrame(drawBurst);
}

function pick(){let w;do{w=SPARKS[Math.floor(Math.random()*SPARKS.length)]}while(w===current&&SPARKS.length>1);return w}
function showRecent(){$("recent").innerHTML=recent.slice(0,6).map(w=>`<span>${w}</span>`).join("")}
function land(w){
  current=w;const el=$("word");el.classList.remove("rolling");el.textContent=w;
  recent.unshift(w);showRecent();rolling=false;
  sparkSeed=Math.floor(Math.random()*1e9);popStart=performance.now();
  if(reduce)drawBurst(performance.now());
}
function draw(){
  if(rolling)return;rolling=true;$("note").textContent="";
  const final=pick(),el=$("word");
  if(reduce){land(final);return}
  el.classList.add("rolling");let n=0;const steps=14;
  (function tick(){
    el.textContent=SPARKS[Math.floor(Math.random()*SPARKS.length)];n++;
    if(n<steps)setTimeout(tick,40+n*n*1.6);else land(final);
  })();
}
$("draw").addEventListener("click",draw);
$("copy").addEventListener("click",()=>{
  const text=`Your spark is ${current}. No prompt required.`;
  try{navigator.clipboard.writeText(text).then(()=>{$("note").textContent="Copied: "+text},()=>{$("note").textContent=text})}catch(e){$("note").textContent=text}
});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();draw()}});
popStart=performance.now();requestAnimationFrame(drawBurst);
</script>
</body>
</html>
