<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elisha JK Miller, card</title>
  <meta name="description" content="Elisha JK Miller, Technologist and Systems Builder in Joplin, MO. Flip the card, save the contact.">
  <meta property="og:title" content="Elisha JK Miller">
  <meta property="og:description" content="Technologist and Systems Builder. Joplin, MO.">
  <meta property="og:image" content="https://elishajkmiller.com/card/card-front.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    .cardwrap{display:flex;flex-direction:column;align-items:center;padding-bottom:40px}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .stage{width:100%;max-width:560px;perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
    .float,.sway{transform-style:preserve-3d}
    .float{animation:bob 6s ease-in-out infinite}
    .sway{animation:sway 9s ease-in-out infinite alternate}
    @keyframes sway{0%{transform:rotateY(-6deg) rotateX(2.5deg) rotateZ(-1deg)}100%{transform:rotateY(6deg) rotateX(-2.5deg) rotateZ(1deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .card3d{position:relative;width:100%;aspect-ratio:7/4;transform-style:preserve-3d;cursor:grab;outline:none;transition:transform .8s cubic-bezier(.2,.8,.2,1);border-radius:14px}
    .card3d.drag{transition:none;cursor:grabbing}
    .card3d:focus-visible{box-shadow:0 0 0 3px var(--red-soft)}
    .face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5)}
    .face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
    .face.front{transform:translateZ(6px)}
    .face.back{transform:rotateY(180deg) translateZ(6px)}
    .slab{position:absolute;inset:0;border-radius:14px;background:#34322f;backface-visibility:visible}
    .slab:nth-child(odd){background:#2a2826}
    .shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--sx,50%) var(--sy,30%),rgba(255,255,255,.16),rgba(255,255,255,0) 55%);opacity:0;transition:opacity .3s}
    .card3d.live .shine{opacity:1}
    .bits{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .3s}
    .card3d.live .bits{opacity:1}
    .hintrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin:22px 0 22px}
    .hint{color:#9d9a96;font-size:.9rem;text-align:center;white-space:nowrap}
    .flipbtn{display:inline-flex;align-items:center;gap:8px;font:600 14px 'Source Sans 3',sans-serif;padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:#d8d5d1;cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
    .flipbtn:hover{border-color:var(--red);color:var(--red-soft)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
    .btn{display:inline-flex;align-items:center;gap:8px;font:600 14px 'Source Sans 3',sans-serif;padding:9px 18px;border-radius:8px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;transition:opacity .2s}
    .btn.alt{background:transparent;color:var(--red-soft)}
    .btn:hover{opacity:.85}
    .rows{width:100%;max-width:440px;display:grid;gap:6px}
    .rows a{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);transition:border-color .2s,color .2s}
    .rows a:hover{border-color:var(--red);color:var(--red-soft)}
    .rows i{font-size:18px;color:var(--red);flex:none}
    .rows span{overflow-wrap:anywhere}
    .copyrows{width:100%;max-width:440px;display:grid;gap:8px;margin-bottom:18px}
    .crow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg2)}
    .cval{overflow-wrap:anywhere;color:#e2dfdb}
    .crow .btn{flex:none;white-space:nowrap}
    .dl{width:100%;max-width:440px;margin-top:10px}
    .dl-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:1.1rem;text-align:center;margin-bottom:12px}
    .dl-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .dl-col{display:flex;flex-direction:column;gap:8px;align-items:stretch;border:1px solid var(--border);border-radius:8px;background:var(--bg2);padding:12px}
    .dl-sub{text-align:center;font-weight:600;line-height:1.3;margin-bottom:2px}
    .dl-sub small{color:#9d9a96;font-weight:400;font-size:.78rem}
    .dl-col .btn{justify-content:center}
    .dl-col.wide{grid-column:1 / -1}
    .foot{margin-top:22px;color:#8d8a86;font-size:.8rem}
    .foot a{text-decoration:underline}
    @media(prefers-reduced-motion:reduce){.float,.sway{animation:none}.card3d{transition:none}}
  </style>
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>

  <main class="main">
    <div class="page-title">Card</div>

    <div class="divider"></div>

<div class="cardwrap">

<div class="stage" id="stage">
  <div class="float">
   <div class="sway">
    <div class="card3d" id="card" tabindex="0" role="button" aria-pressed="false" aria-label="Business card. Press Enter to flip it.">
      <div class="face front"><img src="/card/card-front.png" alt="Front of the card: Elisha JK Miller, Technologist, Systems Builder, Joplin, MO"><canvas class="bits" aria-hidden="true"></canvas><div class="shine"></div></div>
      <div class="face back"><img src="/card/card-back.png" alt="Back of the card: email elishajkmiller@proton.me, web elishajkmiller.com, GitHub elishajkmiller, text 417-317-3051, and a QR code to this page"><canvas class="bits" aria-hidden="true"></canvas><div class="shine"></div></div>
    </div>
   </div>
  </div>
</div>

<div class="hintrow">
  <span class="hint">Drag the card, or tap it to flip.</span>
  <button class="flipbtn" id="flip" type="button"><i class="ti ti-rotate-360" aria-hidden="true"></i>Flip card</button>
</div>

<div class="copyrows">
  <div class="crow"><span class="cval">elishajkmiller@proton.me</span><button class="btn alt copy" type="button" data-copy="elishajkmiller@proton.me" data-label="Copy email"><i class="ti ti-copy" aria-hidden="true"></i><span>Copy email</span></button></div>
  <div class="crow"><span class="cval">elishajkmiller.com</span><button class="btn alt copy" type="button" data-copy="https://elishajkmiller.com" data-label="Copy website"><i class="ti ti-copy" aria-hidden="true"></i><span>Copy website</span></button></div>
  <div class="crow"><span class="cval">417-317-3051</span><a class="btn alt" href="sms:+14173173051"><i class="ti ti-message" aria-hidden="true"></i><span>Message me</span></a></div>
</div>

<div class="dl">
  <div class="dl-title">Download card</div>
  <div class="dl-cols">
    <div class="dl-col">
      <div class="dl-sub">Card<br><small>3.5 x 2 in, 300 dpi</small></div>
      <a class="btn alt" href="/card/card-front.png" download="elisha-jk-miller-card-front.png"><i class="ti ti-download" aria-hidden="true"></i>Front</a>
      <a class="btn alt" href="/card/card-back.png" download="elisha-jk-miller-card-back.png"><i class="ti ti-download" aria-hidden="true"></i>Back</a>
    </div>
    <div class="dl-col">
      <div class="dl-sub">Printing<br><small>with 0.125 in bleed</small></div>
      <a class="btn alt" href="/card/card-front-bleed.png" download="elisha-jk-miller-card-front-print.png"><i class="ti ti-printer" aria-hidden="true"></i>Front</a>
      <a class="btn alt" href="/card/card-back-bleed.png" download="elisha-jk-miller-card-back-print.png"><i class="ti ti-printer" aria-hidden="true"></i>Back</a>
    </div>
    <div class="dl-col wide">
      <div class="dl-sub">Contact<br><small>vCard (.vcf) for your address book</small></div>
      <a class="btn alt" href="/card/elisha-jk-miller.vcf" download="elisha-jk-miller.vcf"><i class="ti ti-download" aria-hidden="true"></i>Save contact</a>
    </div>
  </div>
</div>

</div>
  </main>
</div>
<script src="/components/sidebar.js"></script>

<script>
(function(){
  var card=document.getElementById('card');
  var stage=document.getElementById('stage');
  var angle=0;            /* where the card is heading to rest, always a multiple of 180 */
  var curY=0,curX=0;      /* what is drawn right now (degrees) */
  var vY=0,vX=0;          /* how fast it is turning (degrees per second) */
  var raf=0,last=0,samples=[];
  var dragging=false,moved=false,sx=0,sy=0,startAngle=0,dirX=1,dirY=1;
  var calm=false;
  try{calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

  /* the card's edge: a stack of thin slabs between the two faces gives it thickness */
  (function(){
    var k;
    for(k=-5;k<=5;k++){
      var sl=document.createElement('div');
      sl.className='slab';
      sl.style.transform='translateZ('+k+'px)';
      card.insertBefore(sl,card.querySelector('.face'));
    }
  })();

  /* Hover turns the whole card into ASCII art, photo included (the white bloom still follows the pointer on top).
     Flat black becomes faint zeros and ones; text, the photo, the QR code and the stripe become
     characters picked by brightness and tinted with the pixel's own color. The picture is read from
     the card image itself, so it follows any change to the design. */
  var bitEls=card.querySelectorAll('.bits'),faceImgs=card.querySelectorAll('.face img');
  var COLS=112,ROWS=40,RAMP=' .:-=+*#%@';
  var cellsOf=[],geo={w:560,h:320,cw:5,ch:8,dpr:1};
  function rnd(){return Math.random()<0.5?'0':'1';}
  function analyse(i){
    var im=faceImgs[i];
    function go(){
      try{
        var c=document.createElement('canvas');
        c.width=im.naturalWidth;c.height=im.naturalHeight;
        var cx=c.getContext('2d');
        cx.drawImage(im,0,0);
        var W=c.width,H=c.height,d=cx.getImageData(0,0,W,H).data,cells=[],j,k,x,y;
        for(j=0;j<ROWS;j++){
          var y0=Math.floor(j*H/ROWS),y1=Math.max(y0+1,Math.floor((j+1)*H/ROWS)),row=[];
          for(k=0;k<COLS;k++){
            var x0=Math.floor(k*W/COLS),x1=Math.max(x0+1,Math.floor((k+1)*W/COLS)),r=0,g=0,b=0,n=0;
            for(y=y0;y<y1;y++){for(x=x0;x<x1;x++){var o=(y*W+x)*4;r+=d[o];g+=d[o+1];b+=d[o+2];n++;}}
            r/=n;g/=n;b/=n;
            if(Math.abs(r-17)<=6&&Math.abs(g-17)<=6&&Math.abs(b-16)<=6){
              row.push({black:true,ch:rnd()});
            }else{
              var L=0.2126*r+0.7152*g+0.0722*b,m=Math.max(r,g,b,1),sc=(110+(m/255)*145)/m;
              row.push({black:false,ch:RAMP.charAt(Math.min(9,Math.max(1,Math.round(L/255*9)))),
                col:'rgb('+Math.min(255,Math.round(r*sc))+','+Math.min(255,Math.round(g*sc))+','+Math.min(255,Math.round(b*sc))+')'});
            }
          }
          cells.push(row);
        }
        cellsOf[i]=cells;
      }catch(er){cellsOf[i]=null;}
      layout();
    }
    if(im.complete&&im.naturalWidth){go();}else{im.addEventListener('load',go);}
  }
  function paintCell(i,j,k,clear){
    var cx=bitEls[i].getContext('2d'),c=cellsOf[i][j][k],X=k*geo.cw,Y=j*geo.ch;
    if(clear){cx.clearRect(X-0.5,Y-0.5,geo.cw+1,geo.ch+1);}
    if(c.black){
      cx.fillStyle='rgba(255,255,255,0.30)';
    }else{
      cx.fillStyle='rgb(17,17,16)';
      cx.fillRect(X-0.5,Y-0.5,geo.cw+1,geo.ch+1);
      cx.fillStyle=c.col;
    }
    cx.fillText(c.ch,X+geo.cw/2,Y+geo.ch/2);
  }
  function paintAll(i){
    var cv=bitEls[i],cx=cv.getContext('2d'),cells=cellsOf[i],j,k;
    if(!cx||!cells){return;}
    cx.setTransform(geo.dpr,0,0,geo.dpr,0,0);
    cx.clearRect(0,0,geo.w,geo.h);
    cx.font=Math.round(geo.ch*0.95*10)/10+'px monospace';
    cx.textAlign='center';
    cx.textBaseline='middle';
    for(j=0;j<ROWS;j++){for(k=0;k<COLS;k++){paintCell(i,j,k,false);}}
  }
  function layout(){
    /* offsetWidth is the card's real size, not skewed by the sway or a flip in progress */
    var w=card.offsetWidth||560,h=card.offsetHeight||320,i;
    geo={w:w,h:h,cw:w/COLS,ch:h/ROWS,dpr:Math.min(2,window.devicePixelRatio||1)};
    for(i=0;i<bitEls.length;i++){
      bitEls[i].width=Math.round(w*geo.dpr);
      bitEls[i].height=Math.round(h*geo.dpr);
      paintAll(i);
    }
  }
  analyse(0);analyse(1);
  window.addEventListener('resize',layout);
  if(!calm){
    setInterval(function(){
      if(card.className.indexOf('live')<0){return;}
      var i,n;
      for(i=0;i<bitEls.length;i++){
        if(!cellsOf[i]){continue;}
        for(n=0;n<50;n++){
          var j=Math.floor(Math.random()*ROWS),k=Math.floor(Math.random()*COLS),c=cellsOf[i][j][k];
          if(c.black){c.ch=rnd();paintCell(i,j,k,true);}
        }
      }
    },140);
  }

  function apply(rx,ry){card.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';}
  function showing(){return Math.abs(Math.round(angle/180))%2===1;}   /* true when the back faces you */
  function now(){return (window.performance&&performance.now)?performance.now():Date.now();}

  /* gravity: a spring pulls the card toward its resting face. It is a little under-damped, so a
     fast swipe carries it past the face and it rocks back and settles, instead of clicking into place */
  var STIFF=80,DAMP=12;
  function finish(){
    raf=0;curY=angle;curX=0;vY=0;vX=0;
    card.className='card3d';
    apply(0,angle);
    card.setAttribute('aria-pressed',showing()?'true':'false');
  }
  function loop(t){
    var dt=Math.min(0.032,(t-last)/1000);
    if(!(dt>0)){dt=0.016;}
    last=t;
    vY+=(STIFF*(angle-curY)-DAMP*vY)*dt;
    curY+=vY*dt;
    vX+=(STIFF*(0-curX)-DAMP*vX)*dt;
    curX+=vX*dt;
    apply(curX,curY);
    if(Math.abs(vY)<2&&Math.abs(angle-curY)<0.15&&Math.abs(vX)<2&&Math.abs(curX)<0.15){finish();return;}
    raf=requestAnimationFrame(loop);
  }
  function go(){
    if(calm||!window.requestAnimationFrame){finish();return;}
    card.className='card3d drag live';
    card.setAttribute('aria-pressed',showing()?'true':'false');
    if(!raf){last=now();raf=requestAnimationFrame(loop);}
  }
  function flip(){
    angle=Math.round(angle/180)*180+180;
    go();
  }
  function shine(e){
    var r=card.getBoundingClientRect();
    card.style.setProperty('--sx',((e.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--sy',((e.clientY-r.top)/r.height*100)+'%');
  }
  function release(vel){
    vY=vel;vX=0;
    angle=Math.round((curY+vel*0.28)/180)*180;   /* a hard swipe can carry it past more than one face */
    go();
  }

  stage.addEventListener('pointerdown',function(e){
    if(raf){cancelAnimationFrame(raf);raf=0;}
    vY=0;vX=0;
    dragging=true;moved=false;sx=e.clientX;sy=e.clientY;startAngle=curY;
    samples=[{t:now(),y:curY}];
    /* which half you grabbed decides which way it turns: the right half turns the opposite way to the left half */
    var gr=card.getBoundingClientRect();
    dirX=(e.clientX-gr.left)>gr.width/2?1:-1;
    dirY=(e.clientY-gr.top)>gr.height/2?-1:1;
    card.className='card3d drag live';
    try{stage.setPointerCapture(e.pointerId);}catch(er){}
  });
  stage.addEventListener('pointermove',function(e){
    shine(e);
    var r=card.getBoundingClientRect();
    if(dragging){
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4){moved=true;}
      curY=startAngle+dirX*dx*0.5;
      curX=Math.max(-25,Math.min(25,dirY*dy*0.2));
      apply(curX,curY);
      samples.push({t:now(),y:curY});
      if(samples.length>8){samples.shift();}
    }else if(!calm&&!raf&&e.pointerType==='mouse'){
      card.className='card3d drag live';
      var px=(e.clientX-r.left)/r.width-0.5,py=(e.clientY-r.top)/r.height-0.5;
      curX=-py*14;curY=angle+px*18;
      apply(curX,curY);
    }
  });
  stage.addEventListener('pointerup',function(e){
    if(!dragging){return;}
    dragging=false;
    if(!moved){angle=Math.round(curY/180)*180;flip();return;}
    /* speed of the last ~100 ms of the swipe */
    var n=samples.length,t1=samples[n-1].t,k=n-1;
    while(k>0&&t1-samples[k-1].t<100){k--;}
    var dtt=(t1-samples[k].t)/1000,vel=dtt>0?(samples[n-1].y-samples[k].y)/dtt:0;
    if(now()-t1>120){vel=0;}   /* held still before letting go: no throw */
    release(Math.max(-2600,Math.min(2600,vel)));
  });
  stage.addEventListener('pointercancel',function(){if(dragging){dragging=false;release(0);}});
  stage.addEventListener('pointerleave',function(){if(!dragging&&!raf){curX=0;curY=angle;card.className='card3d';apply(0,angle);}});
  card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  document.getElementById('flip').onclick=flip;

  var copies=document.querySelectorAll('.copy'),ci;
  function wire(btn){
    var lab=btn.querySelector('span');
    btn.onclick=function(){
      var text=btn.getAttribute('data-copy'),orig=btn.getAttribute('data-label');
      var done=function(){lab.textContent='Copied!';setTimeout(function(){lab.textContent=orig;},1800);};
      if(navigator.clipboard){navigator.clipboard.writeText(text).then(done,function(){lab.textContent='Press and hold the text';});}
      else{lab.textContent='Press and hold the text';}
    };
  }
  for(ci=0;ci<copies.length;ci++){wire(copies[ci]);}
  finish();
})();
</script>
</body>
</html>
